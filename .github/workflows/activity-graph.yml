name: GitHub Activity Graph

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'github-contribution-graph.svg'  # Prevent recursive triggers
  workflow_dispatch:

jobs:
  build:
    name: Generate Activity Graph
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: biswa16-dev
          options: bg_color=101010&color=ffffff&line=ff0000&point=ffffff&area=true&hide_border=true&hide_title=true
          output_path: github-contribution-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Add tooltips to SVG
        run: python .github/scripts/add_tooltips.py
      - name: Commit and push
        run: |
          git config --global user.name "biswa16-dev"
          git config --global user.email "biswa1601.nk@gmail.com"
          git add github-contribution-graph.svg
          # Only commit if the SVG actually changed
          git diff --staged --quiet || (git commit -m "Update activity graph" && git push)
